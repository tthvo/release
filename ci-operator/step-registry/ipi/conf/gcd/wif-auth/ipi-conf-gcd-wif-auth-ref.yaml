ref:
  as: ipi-conf-gcd-wif-auth
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: ipi-conf-gcd-wif-auth-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: GOOGLE_CLOUD_UNIVERSE_DOMAIN
    default: "apis-berlin-build0.goog"
    documentation: |-
      The universe domain for Google Cloud Dedicated.
  documentation: |-
    Validates the GCD WIF credential configuration and sets environment
    variables required for Google Cloud Dedicated authentication.
